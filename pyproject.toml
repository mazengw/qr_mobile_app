[project]
name = "qr-vault-mobile"
version = "1.0.0"
description = "QR Vault mobile client"
# Pin below 3.14 so `flet build` resolves to Python 3.13 (more mobile wheels).
requires-python = ">=3.12,<3.14"

[tool.flet]
org = "com.qrvault"
product = "QR Vault"
permissions = ["camera", "location"]

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

[tool.flet.android.feature]
"android.hardware.camera" = false
"android.hardware.camera.any" = false

# Local PDF.js viewer is served over http://127.0.0.1 — Android blocks cleartext by default.
[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.flet.ios.info]
NSCameraUsageDescription = "QR Vault uses the camera to scan vault QR codes."
NSLocationWhenInUseUsageDescription = "QR Vault uses your location to pin the restaurant on the map."
